<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trazos · Jugamos y aprendemos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/infantil.css">
  <style>
    .lienzo {
      position: relative;
      width: min(92vw, calc(100vh - 300px), 640px);
      aspect-ratio: 1;
      background: #fff;
      border-radius: 32px;
      box-shadow: var(--shadow);
      touch-action: none;
    }
    .lienzo canvas { position: absolute; inset: 0; width: 100%; height: 100%; border-radius: 32px; }
    .controles { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 14px; }
    .lienzo.hecho { animation: bote .6s; outline: 6px solid var(--ok); }
    /* Botones para que el profe diga si el niño ha llegado */
    .valida { display: flex; gap: 10px; }
    .valida button {
      border: 0;
      border-radius: 999px;
      padding: 14px 20px;
      font-size: clamp(1rem, 3.2vw, 1.2rem);
      font-weight: 600;
      cursor: pointer;
      box-shadow: var(--shadow);
    }
    .valida button:active { transform: translateY(4px); box-shadow: var(--shadow-press); }
    .valida .si { background: #e9fbf0; color: #1f7a48; }
    .valida .no { background: #fdeceb; color: #b23b32; }
  </style>
</head>
<body>
  <main class="zona-juego" id="app"></main>

  <script type="module">
    import { cabecera, pantallaInicio, pantallaFinal, params, sonidoAcierto, sample, el, Progreso, nota } from './js/comun.js';
    import { empezarSesion, registrarRonda, terminarSesion } from './js/storage.js';
    import { cargarFoto } from './js/fotos.js';

    // Trazos en coordenadas normalizadas (0..1). inicio/fin: emoji de apoyo en los extremos; apoyo: dibujo grande al lado.
    const vertical = (enunciado, arriba, abajo) => ({ enunciado, puntos: [[0.5, 0.2], [0.5, 0.82]], inicio: [arriba, 0.5, 0.09], fin: [abajo, 0.5, 0.92] });
    const tumbada = (enunciado, izq, der) => ({ enunciado, puntos: [[0.2, 0.5], [0.8, 0.5]], inicio: [izq, 0.09, 0.5], fin: [der, 0.91, 0.5] });
    const verticales = sample([
      vertical('Haz que caiga la lluvia de la nube a la flor. De arriba abajo.', '☁️', '🌷'),
      vertical('La manzana cae del árbol a la cesta.', '🌳', '🧺'),
      vertical('La lluvia cae de la nube al paraguas. De arriba abajo.', '☁️', 'paraguas'),
      vertical('La ardilla baja del árbol al suelo.', '🌳', '🐿️')
    ], 2);
    const tumbadas = sample([
      tumbada('Lleva el coche hasta la casa. Raya tumbada.', '🚗', '🏠'),
      tumbada('Lleva la abeja hasta la flor.', '🐝', '🌻'),
      tumbada('Lleva el conejo hasta la zanahoria. Raya tumbada.', '🐰', 'zanahoria'),
      tumbada('Lleva el perro hasta la pelota.', '🐶', '⚽'),
      tumbada('Lleva el ratón hasta el queso. Raya tumbada.', 'raton', '🧀')
    ], 2);
    const MODOS = {
      lineas: {
        titulo: 'Lluvia y caminos', icono: '🌧️', criterio: 'cr3', color: '#1e88e5',
        intro: 'Vamos a hacer rayas con el dedo. Empieza en el punto verde.',
        rondas: [verticales[0], tumbadas[0], verticales[1], tumbadas[1]]
      },
      uno: {
        titulo: 'Escribo el 1', icono: '✏️', criterio: 'cr2', color: '#e53935',
        intro: 'Vamos a escribir el número uno. Empieza en el punto verde: sube un poquito y baja recto.',
        rondas: sample([
          ['🦆', 'un pato'], ['🍎', 'una manzana'], ['🎈', 'un globo'], ['🐟', 'un pez'], ['⚽', 'una pelota'],
          ['🐢', 'una tortuga'], ['🧸', 'un osito'], ['pato-goma', 'un patito']
        ], 3).map(([e, cosa]) => ({
          enunciado: `Aquí hay ${cosa}. Haz el número uno. Sube un poquito y baja recto.`,
          puntos: [[0.36, 0.33], [0.56, 0.16], [0.56, 0.86]],
          fin: ['⭐', 0.56, 0.94],
          apoyo: [e, 0.82, 0.5, 0.24]
        }))
      }
    };

    const modo = MODOS[params().get('modo')] || MODOS.lineas;
    const idJuego = modo === MODOS.uno ? 'trazo-uno' : 'trazos';
    document.title = `${modo.titulo} · Jugamos y aprendemos`;
    const app = document.getElementById('app');
    let rondaActual = null;
    cabecera({ titulo: modo.titulo });

    pantallaInicio(app, {
      icono: modo.icono,
      titulo: modo.titulo,
      intro: modo.intro,
      onEmpezar: () => {
        empezarSesion(idJuego);
        jugar();
      }
    });

    function jugar() {
      const progreso = new Progreso(app, modo.rondas.length);
      const enunciado = el('<p class="enunciado"></p>');
      const lienzo = el('<div class="lienzo"><canvas class="guia"></canvas><canvas class="trazo"></canvas></div>');
      const controles = el(`
        <div class="controles">
          <button class="btn-redondo" type="button" data-a="borrar" aria-label="Borrar y empezar otra vez">🧽</button>
          <div class="valida" role="group" aria-label="Para el profe: ¿ha llegado?">
            <button class="si" type="button" data-a="si">✅ Ha llegado</button>
            <button class="no" type="button" data-a="no">❌ No ha llegado</button>
          </div>
        </div>`);
      app.append(enunciado, lienzo, controles);
      const [guia, trazo] = lienzo.querySelectorAll('canvas');
      const g = guia.getContext('2d');
      const t = trazo.getContext('2d');

      let W = 0;
      let i = 0;
      let aciertos = 0;
      let dibujando = false;
      let ultimo = null;
      let terminado = false;

      const px = ([x, y]) => [x * W, y * W];

      function medir() {
        const dpr = window.devicePixelRatio || 1;
        W = lienzo.clientWidth;
        for (const c of [guia, trazo]) {
          c.width = W * dpr;
          c.height = W * dpr;
          c.getContext('2d').setTransform(dpr, 0, 0, dpr, 0, 0);
        }
      }

      function pintarGuia(completo = false) {
        g.clearRect(0, 0, W, W);
        const pts = rondaActual.puntos.map(px);
        const camino = () => { g.beginPath(); pts.forEach(([x, y], k) => (k ? g.lineTo(x, y) : g.moveTo(x, y))); };
        g.lineCap = 'round';
        g.lineJoin = 'round';
        camino();
        g.strokeStyle = completo ? '#c8f2d8' : '#ffe6c2';
        g.lineWidth = W * 0.11;
        g.stroke();
        camino();
        g.setLineDash([W * 0.02, W * 0.025]);
        g.strokeStyle = '#f2a541';
        g.lineWidth = W * 0.012;
        g.stroke();
        g.setLineDash([]);
        // flecha de dirección en el primer tramo
        const [a, b] = pts;
        const ang = Math.atan2(b[1] - a[1], b[0] - a[0]);
        const m = [a[0] + (b[0] - a[0]) * 0.45, a[1] + (b[1] - a[1]) * 0.45];
        g.save();
        g.translate(...m);
        g.rotate(ang);
        g.fillStyle = '#f2a541';
        g.beginPath();
        g.moveTo(W * 0.035, 0);
        g.lineTo(-W * 0.02, -W * 0.03);
        g.lineTo(-W * 0.02, W * 0.03);
        g.fill();
        g.restore();
        // punto de inicio
        g.fillStyle = '#2fbf71';
        g.beginPath();
        g.arc(a[0], a[1], W * 0.04, 0, Math.PI * 2);
        g.fill();
        g.font = `${W * 0.09}px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif`;
        g.textAlign = 'center';
        g.textBaseline = 'middle';
        const ronda = rondaActual;
        for (const extra of [ronda.inicio, ronda.fin, ronda.apoyo]) {
          if (!extra) continue;
          const [e, x, y, tam = 0.14] = extra;
          cargarFoto(e).then(im => {
            if (rondaActual !== ronda) return;
            if (!im) { g.fillText(e, x * W, y * W); return; }
            const t = W * tam;
            const k = t / Math.max(im.width, im.height);
            g.drawImage(im, x * W - im.width * k / 2, y * W - im.height * k / 2, im.width * k, im.height * k);
          });
        }
      }

      function prepararRonda() {
        rondaActual = modo.rondas[i];
        terminado = false;
        lienzo.classList.remove('hecho');
        t.clearRect(0, 0, W, W);
        pintarGuia();
        enunciado.textContent = rondaActual.enunciado;
      }

      function anadirPunto(p) {
        t.strokeStyle = modo.color;
        t.lineWidth = W * 0.045;
        t.lineCap = 'round';
        t.lineJoin = 'round';
        t.beginPath();
        t.moveTo(...(ultimo || p));
        t.lineTo(...p);
        t.stroke();
        ultimo = p;
      }

      // El profe mira el trazo y decide si el niño ha llegado.
      function validar(ok) {
        terminado = true;
        dibujando = false;
        registrarRonda(modo.criterio, ok);
        progreso.marcar(i);
        if (!ok) { siguiente(); return; }
        aciertos++;
        lienzo.classList.add('hecho');
        pintarGuia(true);
        sonidoAcierto();
        setTimeout(siguiente, 1500);
      }

      function siguiente() {
        i++;
        if (i < modo.rondas.length) prepararRonda();
        else {
          enunciado.remove();
          lienzo.remove();
          controles.remove();
          progreso.el.remove();
          terminarSesion();
          pantallaFinal({ detalle: `Ha llegado (según el profe): ${aciertos} de ${modo.rondas.length}` });
        }
      }

      const posicion = e => {
        const r = trazo.getBoundingClientRect();
        return [(e.clientX - r.left) * (W / r.width), (e.clientY - r.top) * (W / r.width)];
      };

      trazo.addEventListener('pointerdown', e => {
        if (terminado) return;
        trazo.setPointerCapture(e.pointerId);
        dibujando = true;
        ultimo = null;
        anadirPunto(posicion(e));
        nota(440 + Math.random() * 200, 0, 0.08, { tipo: 'sine', vol: 0.05 });
      });
      trazo.addEventListener('pointermove', e => { if (dibujando && !terminado) anadirPunto(posicion(e)); });
      const soltar = () => { dibujando = false; ultimo = null; };
      trazo.addEventListener('pointerup', soltar);
      trazo.addEventListener('pointercancel', soltar);

      controles.addEventListener('click', e => {
        const a = e.target.closest('button')?.dataset.a;
        if (!a || terminado) return;
        if (a === 'borrar') prepararRonda();
        if (a === 'si' || a === 'no') validar(a === 'si');
      });

      window.addEventListener('resize', () => {
        if (Math.abs(lienzo.clientWidth - W) < 2) return;
        medir();
        prepararRonda();
      });
      medir();
      prepararRonda();
    }
  </script>
</body>
</html>
