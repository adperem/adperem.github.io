<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trazos · Jugamos y aprendemos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/infantil.css">
  <style>
    .lienzo {
      position: relative;
      width: min(92vw, calc(100vh - 230px), 640px);
      aspect-ratio: 1;
      background: #fff;
      border-radius: 32px;
      box-shadow: var(--shadow);
      touch-action: none;
    }
    .lienzo canvas { position: absolute; inset: 0; width: 100%; height: 100%; border-radius: 32px; }
    .controles { display: flex; gap: 18px; }
    .lienzo.hecho { animation: bote .6s; outline: 6px solid var(--ok); }
  </style>
</head>
<body>
  <main class="zona-juego" id="app"></main>

  <script type="module">
    import { cabecera, pantallaInicio, pantallaFinal, hablar, params, sonidoAcierto, pick, el, ELOGIOS, Progreso, nota } from './js/comun.js';
    import { empezarSesion, registrarRonda, terminarSesion } from './js/storage.js';
    import { cargarFoto } from './js/fotos.js';

    // Trazos en coordenadas normalizadas (0..1). inicio/fin: emoji de apoyo en los extremos.
    const MODOS = {
      lineas: {
        titulo: 'Lluvia y caminos', icono: '🌧️', criterio: 'cr3', color: '#1e88e5',
        intro: 'Vamos a hacer rayas con el dedo. Empieza en el punto verde.',
        rondas: [
          { voz: 'Haz que caiga la lluvia de la nube a la flor. De arriba abajo.', puntos: [[0.5, 0.2], [0.5, 0.82]], inicio: ['☁️', 0.5, 0.09], fin: ['🌷', 0.5, 0.92] },
          { voz: 'Lleva el coche hasta la casa. Raya tumbada.', puntos: [[0.2, 0.5], [0.8, 0.5]], inicio: ['🚗', 0.09, 0.5], fin: ['🏠', 0.91, 0.5] },
          { voz: 'La manzana cae del árbol a la cesta.', puntos: [[0.5, 0.2], [0.5, 0.82]], inicio: ['🌳', 0.5, 0.09], fin: ['🧺', 0.5, 0.92] },
          { voz: 'Lleva la abeja hasta la flor.', puntos: [[0.2, 0.5], [0.8, 0.5]], inicio: ['🐝', 0.09, 0.5], fin: ['🌻', 0.91, 0.5] }
        ]
      },
      uno: {
        titulo: 'Escribo el 1', icono: '✏️', criterio: 'cr2', color: '#e53935',
        intro: 'Vamos a escribir el número uno. Empieza en el punto verde: sube un poquito y baja recto.',
        rondas: [0, 1, 2].map(() => ({
          voz: 'Haz el número uno. Sube un poquito y baja recto.',
          puntos: [[0.36, 0.33], [0.56, 0.16], [0.56, 0.86]],
          fin: ['⭐', 0.56, 0.94]
        }))
      }
    };

    const modo = MODOS[params().get('modo')] || MODOS.lineas;
    const idJuego = modo === MODOS.uno ? 'trazo-uno' : 'trazos';
    document.title = `${modo.titulo} · Jugamos y aprendemos`;
    const app = document.getElementById('app');
    let rondaActual = null;
    cabecera({ titulo: modo.titulo, onRepetir: () => rondaActual && hablar(rondaActual.voz) });

    pantallaInicio(app, {
      icono: modo.icono,
      titulo: modo.titulo,
      onEmpezar: () => {
        empezarSesion(idJuego);
        jugar(hablar(modo.intro));
      }
    });

    function jugar(intro) {
      const progreso = new Progreso(app, modo.rondas.length);
      const lienzo = el('<div class="lienzo"><canvas class="guia"></canvas><canvas class="trazo"></canvas></div>');
      const controles = el(`
        <div class="controles">
          <button class="btn-redondo" type="button" data-a="borrar" aria-label="Borrar y empezar otra vez">🧽</button>
          <button class="btn-redondo" type="button" data-a="saltar" aria-label="Saltar (para el profe)">⏭️</button>
        </div>`);
      app.append(lienzo, controles);
      const [guia, trazo] = lienzo.querySelectorAll('canvas');
      const g = guia.getContext('2d');
      const t = trazo.getContext('2d');

      let W = 0;
      let i = 0;
      let aciertos = 0;
      let muestras = [];   // puntos del camino que hay que cubrir
      let cubiertas = [];
      let dentro = 0;
      let fuera = 0;
      let trazos = 0;
      let dibujando = false;
      let ultimo = null;
      let terminado = false;

      const px = ([x, y]) => [x * W, y * W];

      function medir() {
        const dpr = window.devicePixelRatio || 1;
        W = lienzo.clientWidth;
        for (const c of [guia, trazo]) {
          c.width = W * dpr;
          c.height = W * dpr;
          c.getContext('2d').setTransform(dpr, 0, 0, dpr, 0, 0);
        }
      }

      function distSegmento(p, a, b) {
        const dx = b[0] - a[0];
        const dy = b[1] - a[1];
        const l2 = dx * dx + dy * dy || 1;
        const k = Math.max(0, Math.min(1, ((p[0] - a[0]) * dx + (p[1] - a[1]) * dy) / l2));
        return Math.hypot(p[0] - a[0] - k * dx, p[1] - a[1] - k * dy);
      }

      function distCamino(p) {
        const pts = rondaActual.puntos.map(px);
        let d = Infinity;
        for (let k = 0; k < pts.length - 1; k++) d = Math.min(d, distSegmento(p, pts[k], pts[k + 1]));
        return d;
      }

      function pintarGuia(completo = false) {
        g.clearRect(0, 0, W, W);
        const pts = rondaActual.puntos.map(px);
        const camino = () => { g.beginPath(); pts.forEach(([x, y], k) => (k ? g.lineTo(x, y) : g.moveTo(x, y))); };
        g.lineCap = 'round';
        g.lineJoin = 'round';
        camino();
        g.strokeStyle = completo ? '#c8f2d8' : '#ffe6c2';
        g.lineWidth = W * 0.11;
        g.stroke();
        camino();
        g.setLineDash([W * 0.02, W * 0.025]);
        g.strokeStyle = '#f2a541';
        g.lineWidth = W * 0.012;
        g.stroke();
        g.setLineDash([]);
        // flecha de dirección en el primer tramo
        const [a, b] = pts;
        const ang = Math.atan2(b[1] - a[1], b[0] - a[0]);
        const m = [a[0] + (b[0] - a[0]) * 0.45, a[1] + (b[1] - a[1]) * 0.45];
        g.save();
        g.translate(...m);
        g.rotate(ang);
        g.fillStyle = '#f2a541';
        g.beginPath();
        g.moveTo(W * 0.035, 0);
        g.lineTo(-W * 0.02, -W * 0.03);
        g.lineTo(-W * 0.02, W * 0.03);
        g.fill();
        g.restore();
        // punto de inicio
        g.fillStyle = '#2fbf71';
        g.beginPath();
        g.arc(a[0], a[1], W * 0.04, 0, Math.PI * 2);
        g.fill();
        g.font = `${W * 0.09}px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif`;
        g.textAlign = 'center';
        g.textBaseline = 'middle';
        const ronda = rondaActual;
        for (const extra of [ronda.inicio, ronda.fin]) {
          if (!extra) continue;
          const [e, x, y] = extra;
          cargarFoto(e).then(im => {
            if (rondaActual !== ronda) return;
            if (!im) { g.fillText(e, x * W, y * W); return; }
            const t = W * 0.14;
            const k = t / Math.max(im.width, im.height);
            g.drawImage(im, x * W - im.width * k / 2, y * W - im.height * k / 2, im.width * k, im.height * k);
          });
        }
      }

      function prepararRonda() {
        rondaActual = modo.rondas[i];
        terminado = false;
        dentro = 0;
        fuera = 0;
        trazos = 0;
        lienzo.classList.remove('hecho');
        t.clearRect(0, 0, W, W);
        // muestras cada ~1,5 % del ancho a lo largo del camino
        muestras = [];
        const pts = rondaActual.puntos.map(px);
        for (let k = 0; k < pts.length - 1; k++) {
          const [a, b] = [pts[k], pts[k + 1]];
          const n = Math.max(2, Math.round(Math.hypot(b[0] - a[0], b[1] - a[1]) / (W * 0.015)));
          for (let s = 0; s <= n; s++) muestras.push([a[0] + (b[0] - a[0]) * s / n, a[1] + (b[1] - a[1]) * s / n]);
        }
        cubiertas = muestras.map(() => false);
        pintarGuia();
        const voz = rondaActual.voz;
        // En la primera ronda se espera a que termine la explicación inicial.
        (i === 0 ? intro : Promise.resolve()).then(() => { if (rondaActual.voz === voz && !terminado) hablar(voz); });
      }

      function anadirPunto(p) {
        const tol = W * 0.065;
        cubiertas = cubiertas.map((c, k) => c || Math.hypot(p[0] - muestras[k][0], p[1] - muestras[k][1]) < tol);
        if (distCamino(p) > W * 0.1) fuera++;
        else dentro++;
        t.strokeStyle = modo.color;
        t.lineWidth = W * 0.045;
        t.lineCap = 'round';
        t.lineJoin = 'round';
        t.beginPath();
        t.moveTo(...(ultimo || p));
        t.lineTo(...p);
        t.stroke();
        ultimo = p;
        if (!terminado && cubiertas.filter(Boolean).length / cubiertas.length >= 0.9) completar();
      }

      function completar() {
        terminado = true;
        dibujando = false;
        // Bien hecho: casi todo el trazo dentro de la guía y como mucho 2 trazos.
        const ok = fuera / Math.max(1, dentro + fuera) <= 0.25 && trazos <= 2;
        registrarRonda(modo.criterio, ok);
        if (ok) aciertos++;
        lienzo.classList.add('hecho');
        pintarGuia(true);
        sonidoAcierto();
        progreso.marcar(i);
        hablar(pick(ELOGIOS));
        setTimeout(siguiente, 1800);
      }

      function siguiente() {
        i++;
        if (i < modo.rondas.length) prepararRonda();
        else {
          lienzo.remove();
          controles.remove();
          progreso.el.remove();
          terminarSesion();
          pantallaFinal({ detalle: `Trazos bien hechos: ${aciertos} de ${modo.rondas.length}` });
        }
      }

      const posicion = e => {
        const r = trazo.getBoundingClientRect();
        return [(e.clientX - r.left) * (W / r.width), (e.clientY - r.top) * (W / r.width)];
      };

      trazo.addEventListener('pointerdown', e => {
        if (terminado) return;
        trazo.setPointerCapture(e.pointerId);
        dibujando = true;
        trazos++;
        ultimo = null;
        anadirPunto(posicion(e));
        nota(440 + Math.random() * 200, 0, 0.08, { tipo: 'sine', vol: 0.05 });
      });
      trazo.addEventListener('pointermove', e => { if (dibujando && !terminado) anadirPunto(posicion(e)); });
      const soltar = () => { dibujando = false; ultimo = null; };
      trazo.addEventListener('pointerup', soltar);
      trazo.addEventListener('pointercancel', soltar);

      controles.addEventListener('click', e => {
        const a = e.target.closest('button')?.dataset.a;
        if (!a || terminado) return;
        if (a === 'borrar') prepararRonda();
        if (a === 'saltar') {
          terminado = true;
          registrarRonda(modo.criterio, false);
          progreso.marcar(i);
          siguiente();
        }
      });

      window.addEventListener('resize', () => {
        if (Math.abs(lienzo.clientWidth - W) < 2) return;
        medir();
        prepararRonda();
      });
      medir();
      prepararRonda();
    }
  </script>
</body>
</html>
